  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #FBF7F4 0%, #EAD8CF 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #2C1810;
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: rgba(255,255,255,0.85);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(134,55,62,0.12);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin: 0 auto 18px;
      display: block;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(134,55,62,0.18);
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: #666; line-height: 1.5; margin-bottom: 24px; font-size: 15px; }
    a.btn {
      display: block;
      background: #86373E;
      color: #fff;
      text-decoration: none;
      padding: 16px 24px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 17px;
      margin-bottom: 12px;
    }
    a.btn.secondary {
      background: transparent;
      color: #86373E;
      border: 2px solid #86373E;
    }
    .hint { margin-top: 16px; font-size: 13px; color: #999; }
    code { font-size: 11px; color: #aaa; word-break: break-all; }
    .recipe { display: none; text-align: start; margin: 4px 0 24px; }
    /* Loading state shown while the recipe is fetched (slow networks after a QR scan). */
    .loading { display: none; flex-direction: column; align-items: center; gap: 14px; margin: 8px 0 24px; color: #8a7a74; font-size: 15px; }
    .card.is-loading .loading { display: flex; }
    .card.is-loading #title, .card.is-loading #subtitle { display: none; }
    .spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(134,55,62,0.15); border-top-color: #86373E; animation: spin 0.9s linear infinite; }
    .skeleton { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .skeleton div { height: 52px; border-radius: 14px; background: linear-gradient(90deg, rgba(134,55,62,0.06), rgba(134,55,62,0.14), rgba(134,55,62,0.06)); background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite; }
    .slow { display: none; font-size: 13px; color: #a08f88; }
    .card.is-slow .slow { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .metric { background: rgba(134,55,62,0.07); border-radius: 14px; padding: 10px 12px; }
    .metric span { display: block; font-size: 12px; color: #8a7a74; }
    .metric b { font-size: 17px; }
    ol.steps { list-style: none; counter-reset: s; }
    ol.steps li { counter-increment: s; display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(0,0,0,0.06); font-size: 14px; }
    ol.steps li::before { content: counter(s); flex: none; width: 22px; height: 22px; border-radius: 50%; background: #86373E; color: #fff; font-size: 12px; display: grid; place-items: center; }
    ol.steps small { display: block; color: #8a7a74; }
    button.btn { display: block; width: 100%; border: 0; cursor: pointer; font: inherit; background: #86373E; color: #fff; padding: 16px 24px; border-radius: 16px; font-weight: 700; font-size: 17px; margin-bottom: 12px; }
    #start-brew { display: none; }
    .card.has-journey #start-brew { display: block; }
    .card.has-journey #open-btn { background: transparent; color: #86373E; border: 2px solid #86373E; }

    /* ---------- Brew journey (web version of the app's journey) ---------- */
    .journey { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; background: #FBF7F4; color: #2C1810; padding: max(16px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); }
    .journey.open { display: flex; }
    .j-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .j-close { background: none; border: 0; color: #86373E; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; padding: 8px 0; }
    .j-badge { background: rgba(134,55,62,0.1); color: #86373E; font-weight: 700; font-size: 14px; padding: 6px 12px; border-radius: 999px; }
    .j-bar { height: 6px; border-radius: 999px; background: rgba(0,0,0,0.06); margin: 14px 0 0; overflow: hidden; }
    .j-bar div { height: 100%; width: 0; background: linear-gradient(90deg, #86373E, #BF8A6E); border-radius: 999px; transition: width .35s ease; }
    .j-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }
    .ring { position: relative; width: 240px; height: 240px; }
    .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
    .ring .fill { position: absolute; inset: 14px; border-radius: 50%; overflow: hidden; }
    .ring .fill div { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(180deg, rgba(191,138,110,0.35), rgba(134,55,62,0.45)); transition: height .9s ease; }
    .ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .j-time { font-size: 46px; font-weight: 800; font-variant-numeric: tabular-nums; direction: ltr; }
    .j-total { font-size: 13px; color: #8a7a74; font-weight: 600; }
    .j-count { font-size: 14px; font-weight: 700; color: #86373E; background: rgba(134,55,62,0.1); padding: 4px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; direction: ltr; }
    .j-count.hot { background: #86373E; color: #fff; }
    .j-target { font-size: 28px; font-weight: 800; color: #86373E; }
    .j-plus { font-size: 16px; color: #8a7a74; font-weight: 600; }
    .j-step { font-size: 18px; font-weight: 700; }
    .j-next { font-size: 14px; color: #a08f88; }
    .j-actions { display: flex; gap: 12px; }
    .j-actions button { flex: 1; border: 0; font: inherit; font-weight: 700; font-size: 17px; padding: 16px; border-radius: 18px; cursor: pointer; }
    .j-primary { background: #86373E; color: #fff; }
    .j-soft { background: rgba(134,55,62,0.12); color: #86373E; }
    .j-done { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
    .journey.complete .j-done { display: flex; }
    .journey.complete .j-main, .journey.complete .j-actions, .journey.complete .j-bar { display: none; }
    .j-done .cup { font-size: 64px; }
    .j-done h2 { font-size: 30px; }
    .j-done p { margin: 0; }
    .j-done .btn { width: 100%; max-width: 340px; margin-bottom: 0; }
    .j-done button.j-again { background: transparent; color: #86373E; border: 2px solid #86373E; }
  </style>
</head>

      <span id="loading-text">Loading recipe…</span>
      <div class="skeleton"><div></div><div></div><div></div><div></div></div>
      <span class="slow" id="slow-text">Slow connection — the recipe is still on its way.</span>
    </div>
    <div class="recipe" id="recipe">
      <div class="metrics" id="metrics"></div>
      <ol class="steps" id="steps"></ol>
    </div>
    <button class="btn" id="start-brew" type="button">Start Brewing</button>
    <a class="btn" id="open-btn" href="#">Open in Waznah</a>
    <a class="btn secondary" id="store-btn" href="https://apps.apple.com/sa/app/waznah-%D9%88%D8%B2%D9%86%D8%A9/id1609692144">Get Waznah on the App Store</a>
    <p class="hint"><code id="recipe-id"></code></p>
  </div>

  <div class="journey" id="journey" role="dialog" aria-modal="true" aria-labelledby="j-title">
    <div class="j-top">
      <button class="j-close" id="j-close" type="button">Close</button>
      <span class="j-badge" id="j-badge">Step 1 of 4</span>
    </div>
    <div class="j-bar"><div id="j-bar"></div></div>
    <div class="j-main">
      <div class="ring" aria-hidden="true">
        <div class="fill"><div id="j-fill"></div></div>
        <svg viewBox="0 0 240 240" width="240" height="240">
          <circle cx="120" cy="120" r="110" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="16"/>
          <circle id="j-arc" cx="120" cy="120" r="110" fill="none" stroke="#B57A64" stroke-width="16" stroke-linecap="round" stroke-dasharray="691.15" stroke-dashoffset="691.15"/>
        </svg>
        <div class="center">
          <div class="j-time" id="j-time">00:00</div>
          <div class="j-total" id="j-total"></div>
          <div class="j-count" id="j-count" hidden></div>
        </div>
      </div>
      <div class="j-target" id="j-title">Pour to 40 ml</div>
      <div class="j-plus" id="j-plus"></div>
      <div class="j-step" id="j-step"></div>
      <div class="j-next" id="j-next"></div>
    </div>
    <div class="j-actions">
      <button class="j-primary" id="j-main-btn" type="button">Start</button>
      <button class="j-soft" id="j-next-btn" type="button" hidden>Next</button>
    </div>
    <div class="j-done">
      <div class="cup" aria-hidden="true">☕️</div>
      <h2 id="j-done-title">Brew complete!</h2>
      <p id="j-done-time" class="j-total"></p>
      <a class="btn" id="j-get-app" href="https://apps.apple.com/sa/app/waznah-%D9%88%D8%B2%D9%86%D8%A9/id1609692144">Get Waznah</a>
      <button class="btn j-again" id="j-again" type="button">Brew Again</button>
    </div>
  </div>
  <script>
    (function () {
      var parts = window.location.pathname.split("/").filter(Boolean);
      var recipeId = parts[0] === "r" && parts[1] ? parts[1] : "";
      var wantsBrew = parts[2] === "brew";
      var base = window.location.origin;
      var deepLink = recipeId
        ? base + "/r/" + encodeURIComponent(recipeId) + (wantsBrew ? "/brew" : "")
        : base + "/open";

      document.getElementById("open-btn").href = deepLink;
      document.getElementById("recipe-id").textContent = recipeId || "recipe";

      var langParam = (window.location.search.match(/[?&]lang=(ar|en)/) || [])[1];
      var isAr = langParam ? langParam === "ar" : /^ar/i.test(navigator.language || "");
      if (isAr) {
        document.documentElement.lang = "ar";
        document.documentElement.dir = "rtl";
        document.title = "وصفة — وزنة";
        document.getElementById("title").textContent = wantsBrew
          ? "ابدأ التقطير في وزنة"
          : "افتح هذه الوصفة في وزنة";
        document.getElementById("subtitle").textContent =
          "حمّل التطبيق لعرض خطوات التقطير والمؤقت وأهداف الوزن.";
        document.getElementById("open-btn").textContent = "افتح في وزنة";
        document.getElementById("store-btn").textContent = "حمّل وزنة من App Store";
      } else if (wantsBrew) {
        document.getElementById("title").textContent = "Start brewing in Waznah";
        document.getElementById("subtitle").textContent = "Open the app to follow this recipe step by step.";
      }

      // Load the recipe itself (anonymous sign-in → Firestore REST). Falls back to the generic page on any error.
      if (!recipeId) return;
      var card = document.querySelector(".card");
      card.classList.add("is-loading");
      if (isAr) {
        document.getElementById("loading-text").textContent = "جاري تحميل الوصفة…";
        document.getElementById("slow-text").textContent = "الاتصال بطيء — الوصفة في الطريق، لحظات.";
      }
      var slowTimer = setTimeout(function () { card.classList.add("is-slow"); }, 6000);
      function stopLoading() { clearTimeout(slowTimer); card.classList.remove("is-loading", "is-slow"); }
      var KEY = "AIzaSyCC-kMuvKh1Oh4DCav7s3A576zx6_gqP0Q";
      var PROJECT = "waznah-60781";
      function plain(v) {
        if (!v) return null;
        if ("stringValue" in v) return v.stringValue;
        if ("integerValue" in v) return Number(v.integerValue);
        if ("doubleValue" in v) return v.doubleValue;
        if ("arrayValue" in v) return (v.arrayValue.values || []).map(plain);
        if ("mapValue" in v) { var o = {}, f = v.mapValue.fields || {}; for (var k in f) o[k] = plain(f[k]); return o; }
        return null;
      }
      // Arabic-Indic / Persian digits → ASCII so "١٨" parses like "18".
      function westernDigits(t) {
        return String(t == null ? "" : t)
          .replace(/[\u0660-\u0669]/g, function (c) { return String(c.charCodeAt(0) - 0x0660); })
          .replace(/[\u06F0-\u06F9]/g, function (c) { return String(c.charCodeAt(0) - 0x06F0); })
          .replace(/\u066B/g, ".").replace(/[,\u060C\u066C]/g, ".");
      }
      function num(t) { var n = parseFloat(westernDigits(t).replace(/[^0-9.]/g, "")); return isFinite(n) ? n : 0; }

      // ---------- Brew journey ----------
      function setupJourney(f, autoOpen) {
        var steps = [], target = 0;
        (f.field3 || []).forEach(function (st) {
          var pour = num(st.water);
          if (pour <= 0) return;
          target += pour;
          steps.push({ title: st.step || "", pour: pour, target: target, secs: Math.max(0, Math.round(num(st.time))) });
        });
        if (!steps.length) return;

        var T = isAr
          ? { start: "ابدأ", pause: "إيقاف مؤقت", resume: "استئناف", next: "التالي", finish: "إنهاء", close: "إغلاق", step: "الخطوة %1 من %2", of: "من %1", pourTo: "صب حتى %1 مل", plus: "+%1 مل", nextLbl: "التالي · صب حتى %1 مل", done: "بالعافية!", total: "وقت التحضير: %1", getApp: "حمّل وزنة", again: "حضّر مرة ثانية", startBrew: "ابدأ التحضير", pourLbl: "صب" }
          : { start: "Start", pause: "Pause", resume: "Resume", next: "Next", finish: "Finish", close: "Close", step: "Step %1 of %2", of: "of %1", pourTo: "Pour to %1 ml", plus: "+%1 ml", nextLbl: "Next · Pour to %1 ml", done: "Brew complete!", total: "Total brew time: %1", getApp: "Get Waznah", again: "Brew Again", startBrew: "Start Brewing", pourLbl: "Pour" };
        function fmt(s) { var a = arguments; return s.replace(/%(\d)/g, function (_, i) { return a[i]; }); }
        function mmss(sec) { sec = Math.max(0, Math.floor(sec)); return String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0"); }
        function vol(v) { return (Math.round(v * 10) / 10).toString(); }

        var ends = [], run = 0; steps.forEach(function (s) { run += s.secs; ends.push(run); });
        var total = run, timed = total > 0;
        var $ = function (id) { return document.getElementById(id); };
        var el = $("journey"), mainBtn = $("j-main-btn"), nextBtn = $("j-next-btn");
        var state = { started: false, running: false, done: false, idx: 0, elapsed: 0, anchor: 0, lastBuzz: -1 };
        var ticker = null, wake = null, ARC = 691.15;

        $("start-brew").textContent = T.startBrew;
        $("j-close").textContent = T.close;
        $("j-done-title").textContent = T.done;
        $("j-get-app").textContent = T.getApp;
        $("j-again").textContent = T.again;
        document.querySelector(".card").classList.add("has-journey");

        function keepAwake(on) {
          if (!("wakeLock" in navigator)) return;
          if (on && !wake) navigator.wakeLock.request("screen").then(function (w) { wake = w; w.addEventListener("release", function () { wake = null; }); }).catch(function () {});
          if (!on && wake) { wake.release().catch(function () {}); wake = null; }
        }
        document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && state.running) keepAwake(true); });

        function render() {
          var s = steps[state.idx], nx = steps[state.idx + 1];
          $("j-badge").textContent = fmt(T.step, state.idx + 1, steps.length);
          var prog = state.done ? 1 : timed ? Math.min(state.elapsed / total, 1) : (state.idx + (state.started ? 1 : 0)) / steps.length;
          $("j-bar").style.width = (prog * 100) + "%";
          $("j-arc").setAttribute("stroke-dashoffset", String(ARC * (1 - (timed ? Math.min(state.elapsed / total, 1) : prog))));
          $("j-fill").style.height = (state.started ? (s.target / target) * 100 : 0) + "%";
          $("j-time").textContent = mmss(state.elapsed);
          $("j-total").textContent = timed ? fmt(T.of, mmss(total)) : "";
          var cnt = $("j-count");
          if (timed && state.started) {
            var left = Math.max(ends[state.idx] - state.elapsed, 0);
            cnt.hidden = false; cnt.textContent = "⏳ " + mmss(left); cnt.classList.toggle("hot", left <= 3);
          } else { cnt.hidden = true; }
          $("j-title").textContent = fmt(T.pourTo, vol(s.target));
          $("j-plus").textContent = fmt(T.plus, vol(s.pour));
          $("j-step").textContent = s.title || T.pourLbl;
          $("j-next").textContent = nx ? fmt(T.nextLbl, vol(nx.target)) : "";
          mainBtn.textContent = !state.started ? T.start : state.running ? T.pause : T.resume;
          mainBtn.hidden = state.started && !timed;
          nextBtn.hidden = !state.started;
          nextBtn.textContent = state.idx >= steps.length - 1 ? T.finish : T.next;
        }

        function tick() {
          if (!state.running) return;
          state.elapsed = (Date.now() - state.anchor) / 1000;
          if (timed) {
            var left = ends[state.idx] - state.elapsed;
            var whole = Math.ceil(left);
            if (whole >= 1 && whole <= 3 && whole !== state.lastBuzz) { state.lastBuzz = whole; if (navigator.vibrate) navigator.vibrate(40); }
            var i = state.idx;
            while (i < ends.length - 1 && state.elapsed >= ends[i]) i++;
            if (i !== state.idx) { state.idx = i; if (navigator.vibrate) navigator.vibrate(80); }
            if (state.elapsed >= total) return complete();
          }
          render();
        }

        function setRunning(on) {
          state.running = on;
          if (on) { state.anchor = Date.now() - state.elapsed * 1000; ticker = ticker || setInterval(tick, 250); }
          else { clearInterval(ticker); ticker = null; }
          keepAwake(on);
          render();
        }

        function complete() {
          setRunning(false);
          state.done = true; state.elapsed = Math.min(state.elapsed, timed ? total : state.elapsed);
          el.classList.add("complete");
          $("j-done-time").textContent = timed ? fmt(T.total, mmss(state.elapsed)) : "";
          if (navigator.vibrate) navigator.vibrate([60, 60, 120]);
        }

        function reset() {
          setRunning(false);
          state = { started: false, running: false, done: false, idx: 0, elapsed: 0, anchor: 0, lastBuzz: -1 };
          el.classList.remove("complete");
          render();
        }

        mainBtn.onclick = function () {
          if (!state.started) { state.started = true; return timed ? setRunning(true) : render(); }
          setRunning(!state.running);
        };
        nextBtn.onclick = function () {
          if (state.idx >= steps.length - 1) return complete();
          if (timed) { state.elapsed = ends[state.idx]; if (state.running) state.anchor = Date.now() - state.elapsed * 1000; }
          state.idx++; state.lastBuzz = -1; render();
        };
        $("j-again").onclick = reset;
        $("j-close").onclick = function () { reset(); el.classList.remove("open"); document.body.style.overflow = ""; };
        $("start-brew").onclick = function () { el.classList.add("open"); document.body.style.overflow = "hidden"; render(); };

        render();
        if (autoOpen) $("start-brew").onclick();
      }

      function esc(t) { var d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; }
      fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + KEY, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ returnSecureToken: true })
      })
      .then(function (r) { return r.json(); })
      .then(function (auth) {
        return fetch("https://firestore.googleapis.com/v1/projects/" + PROJECT + "/databases/(default)/documents/recipes/" + encodeURIComponent(recipeId), {
          headers: { Authorization: "Bearer " + auth.idToken }
        });
      })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (doc) {
        var f = {}; for (var k in doc.fields) f[k] = plain(doc.fields[k]);
        var L = isAr
          ? { coffee: "البن", water: "الماء", ratio: "النسبة", temp: "الحرارة", pour: "صب حتى", sec: "ث", grind: "الطحنة" }
          : { coffee: "Coffee", water: "Water", ratio: "Ratio", temp: "Temp", pour: "Pour to", sec: "s", grind: "Grind" };
        document.title = (f.rostery || "Waznah") + " — " + (isAr ? "وزنة" : "Waznah");
        document.getElementById("title").textContent = f.crop || f.rostery || document.getElementById("title").textContent;
        document.getElementById("subtitle").textContent = [f.roaster, f.process, f.tool, f.grain ? L.grind + ": " + f.grain : ""]
          .filter(function (x) { return x; }).join(" · ");
        document.getElementById("metrics").innerHTML = [
          [L.coffee, (f.coffeeGrams || "-") + " g"], [L.water, (f.waterGrams || "-") + " ml"],
          [L.ratio, f.ratio || "-"], [L.temp, (f.temp || "-") + "°"]
        ].map(function (m) { return '<div class="metric"><span>' + esc(m[0]) + '</span><b>' + esc(m[1]) + '</b></div>'; }).join("");
        var total = 0;
        document.getElementById("steps").innerHTML = (f.field3 || []).map(function (st) {
          total += parseFloat(st.water) || 0;
          var t = parseInt(st.time, 10);
          return "<li><div>" + esc(st.step || "") + "<small>" + esc(L.pour) + " " + esc(total) + " ml" + (t > 0 ? " · " + t + L.sec : "") + "</small></div></li>";
        }).join("");
        stopLoading();
        document.getElementById("recipe").style.display = "block";
        setupJourney(f, wantsBrew);
        document.getElementById("recipe-id").textContent = "";
      })
      .catch(function () { stopLoading(); /* fall back to the generic open/download page */ });
    })();
  </script>
</body>
</html>
