  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #FBF7F4 0%, #EAD8CF 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #2C1810;
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: rgba(255,255,255,0.85);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(134,55,62,0.12);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin: 0 auto 20px;
      display: block;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(134,55,62,0.18);
    }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .ar { font-size: 22px; color: #86373E; margin-bottom: 16px; }
    p { color: #666; line-height: 1.5; margin-bottom: 28px; font-size: 15px; }
    a.btn {
      display: block;
      background: #86373E;
      color: #fff;
      text-decoration: none;
      padding: 16px 24px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 17px;
    }
    a.btn:hover { background: #6f2e34; }
    .hint { margin-top: 20px; font-size: 13px; color: #999; }
  </style>
</head>
